name: organize
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: organize
      POSTGRES_USER: organize
      POSTGRES_PASSWORD: organize_local_only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U organize -d organize']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: organize_test
      POSTGRES_USER: organize
      POSTGRES_PASSWORD: organize_test_only
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-15433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U organize -d organize_test']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
