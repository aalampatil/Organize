name: Bug report
description: Report a reproducible problem with Organize.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the [security policy](https://github.com/aalampatil/Organize/blob/main/SECURITY.md).
        Remove private notes, files, credentials, OTPs, and session tokens from reports and screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - API
        - Setup or tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the affected flow and what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your commit/version, device or browser, OS, and Node version when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Include only redacted evidence. Use synthetic notes and files for reproduction.
  - type: checkboxes
    id: readiness
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for this problem.
          required: true
        - label: I removed credentials and private information from this report.
          required: true
